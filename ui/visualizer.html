<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
  /* While the desktop is occluded the host stops pushing frames and the page
     freezes on the last draw — this class is only the edge-case fallback for a
     paused frame that did arrive (e.g. occlusion raced a live packet). */
  body.paused canvas { filter: saturate(0.4) brightness(0.55); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wv = window.chrome && chrome.webview;

const BANDS = 24;
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let R = null, style = 'v1', raf = 0, last = performance.now();
let frozen = false; // drew one dimmed paused frame and halted
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (R && R.resize) R.resize();
}
window.addEventListener('resize', resize);
resize();

// Latest pushed snapshot — the host's 33 ms feed.
const snap = { bands: new Array(BANDS).fill(0), level: 0, peak: 0, paused: false };

// Wallpaper-adaptive palette: `vizTheme` pushes the backdrop probe's accent
// hue + luminance; every renderer rebases its hues on `TH.hue` via `col()`.
// On bright backdrops strokes deepen (LL) and glow gains alpha (AL) so the
// neon stays readable; adaptive off restores the fixed cyber-cyan palette.
const DEF_HUE = 190;
const TH = { adaptive: true, hue: DEF_HUE, light: false };
const H = off => (TH.adaptive ? TH.hue : DEF_HUE) + off;
const AL = a => Math.min(1, a * (TH.light ? 1.3 : 1));
const LL = l => Math.max(10, l - (TH.light ? 18 : 0));
const col = (off, s, l, a) => `hsla(${H(off)}, ${s}%, ${LL(l)}%, ${AL(a)})`;
function hexHue(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return null;
  const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (d < 0.02) return DEF_HUE; // grey wallpaper → keep the cyber default
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}

// Per-design factory: { draw(ctx, w, h, s, dt), reset() }.
const BUILDS = {

  /* v1 — Particle Field: bass lifts the dust, treble jitters it, level glows. */
  v1() {
    const P = [];
    const seed = () => {
      P.length = 0;
      const n = Math.max(90, Math.round(W * H / 2600));
      for (let i = 0; i < n; i++)
        P.push({ x: Math.random() * W, y: Math.random() * H, b: i % BANDS,
                 vy: 0.15 + Math.random() * 0.5, ph: Math.random() * TAU,
                 sz: 0.7 + Math.random() * 1.8 });
    };
    seed();
    return {
      resize: seed,
      draw(c, w, h, s, dt) {
        const bass = avg(s.bands, 0, 7), treb = avg(s.bands, 16, 23);
        c.clearRect(0, 0, w, h);
        c.globalCompositeOperation = 'lighter';
        for (const p of P) {
          const e = s.bands[p.b];
          p.ph += dt * (1 + treb * 6);
          p.y -= (p.vy + bass * 2.6 + e * 1.4) * dt * 60;
          p.x += Math.sin(p.ph) * (0.15 + treb * 0.9);
          if (p.y < -6) { p.y = h + 6; p.x = Math.random() * w; }
          if (p.x < -6) p.x = w + 6; else if (p.x > w + 6) p.x = -6;
          const r = p.sz * (1 + e * 2.2 + s.level * 0.8);
          const a = 0.12 + e * 0.55 + s.level * 0.15;
          const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
          g.addColorStop(0, col((p.b / BANDS) * 130, 95, 65, a));
          g.addColorStop(1, col(10, 90, 50, 0));
          c.fillStyle = g;
          c.beginPath();
          c.arc(p.x, p.y, r * 3, 0, TAU);
          c.fill();
        }
        c.globalCompositeOperation = 'source-over';
      },
      reset: seed,
    };
  },

  /* v2 — Arc Reactor Ring: 24 radial arc segments, breathing ring, peak core. */
  v2() {
    let core = 0;
    return {
      draw(c, w, h, s, dt) {
        core += (s.peak - core) * 0.3;
        const cx = w / 2, cy = h / 2;
        const R0 = Math.min(w, h) * 0.30 * (1 + s.level * 0.09);
        c.clearRect(0, 0, w, h);
        c.globalCompositeOperation = 'lighter';
        // 24 arc segments — band i owns a slice, length + thickness = energy.
        for (let i = 0; i < BANDS; i++) {
          const e = s.bands[i];
          const a0 = -Math.PI / 2 + (i / BANDS) * TAU + 0.011;
          const a1 = a0 + (TAU / BANDS - 0.022) * (0.25 + e * 0.75);
          const r0 = R0, r1 = R0 + Math.min(w, h) * 0.16 * e;
          c.beginPath();
          c.arc(cx, cy, r1, a0, a1);
          c.arc(cx, cy, r0, a1, a0, true);
          c.closePath();
          c.fillStyle = col((i / BANDS) * 140, 95, 52 + e * 20, 0.18 + e * 0.6);
          c.fill();
        }
        // Base ring + tick marks.
        c.lineWidth = Math.max(1, Math.min(w, h) * 0.008);
        c.strokeStyle = col(8, 100, 74, 0.85);
        c.beginPath(); c.arc(cx, cy, R0, 0, TAU); c.stroke();
        c.strokeStyle = col(8, 100, 74, 0.28);
        c.beginPath();
        for (let i = 0; i < BANDS * 2; i++) {
          const a = (i / (BANDS * 2)) * TAU - Math.PI / 2;
          const r1 = R0 + Math.min(w, h) * 0.015, r2 = R0 + Math.min(w, h) * 0.05;
          c.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
          c.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
        }
        c.stroke();
        // Peak core — flashes on transients.
        const cr = R0 * (0.32 + core * 0.3);
        const g = c.createRadialGradient(cx, cy, 0, cx, cy, cr);
        g.addColorStop(0, `rgba(235, 250, 255, ${0.75 + core * 0.25})`);
        g.addColorStop(0.55, col(10, 100, 66, 0.35 + core * 0.4));
        g.addColorStop(1, col(25, 100, 55, 0));
        c.fillStyle = g;
        c.beginPath(); c.arc(cx, cy, cr, 0, TAU); c.fill();
        c.globalCompositeOperation = 'source-over';
      },
      reset() { core = 0; },
    };
  },

  /* v3 — Spectrum Ribbons: 24 translucent flowing ribbons with parallax ghosts. */
  v3() {
    const hist = new Array(BANDS).fill(0);
    return {
      draw(c, w, h, s, dt) {
        c.clearRect(0, 0, w, h);
        const n = BANDS, slot = w / n;
        const bw = Math.max(2, slot * 0.62);
        const floor = h * 0.94;
        c.globalCompositeOperation = 'lighter';
        for (let i = 0; i < n; i++) {
          // Extra smoothing on top of the engine's EMA — butter motion.
          hist[i] += (s.bands[i] - hist[i]) * (s.bands[i] > hist[i] ? 0.5 : 0.18);
          const e = hist[i];
          const x = i * slot + (slot - bw) / 2;
          const hoff = (i / n) * 130;
          // Two parallax ghost layers behind.
          for (const [depth, alpha] of [[2, 0.10], [1, 0.18]]) {
            const gh = e * h * 0.82 * (1 - depth * 0.16);
            if (gh > 1) {
              c.fillStyle = col(hoff, 80, 60, alpha);
              roundTop(c, x + depth * 1.5, floor - gh, bw - depth * 1.5, gh, bw / 2);
              c.fill();
            }
          }
          const bh = Math.max(2, e * h * 0.82);
          const g = c.createLinearGradient(0, floor - bh, 0, floor);
          g.addColorStop(0, col(hoff, 95, 72, 0.25 + e * 0.7));
          g.addColorStop(1, col(hoff + 20, 90, 48, 0.10 + e * 0.35));
          c.fillStyle = g;
          roundTop(c, x, floor - bh, bw, bh, Math.min(bw / 2, bh));
          c.fill();
          // Hot cap on the ribbon tip.
          if (e > 0.05) {
            c.fillStyle = col(hoff, 100, 80, 0.3 + e * 0.6);
            c.beginPath();
            c.ellipse(x + bw / 2, floor - bh, bw / 2, Math.min(bw / 2, 3 + e * 4), 0, 0, TAU);
            c.fill();
          }
        }
        // Floor glow line.
        const fg = c.createLinearGradient(0, floor, w, floor);
        fg.addColorStop(0, col(0, 95, 60, 0));
        fg.addColorStop(0.5, col(12, 100, 76, 0.15 + s.level * 0.4));
        fg.addColorStop(1, col(70, 90, 60, 0));
        c.fillStyle = fg;
        c.fillRect(0, floor - 1, w, 2);
        c.globalCompositeOperation = 'source-over';
      },
      reset() { hist.fill(0); },
    };
  },

  /* v4 — Neon Terrain: scrolling synthwave ridgeline, peak lightning. */
  v4() {
    let ridge = [], flash = 0, bolt = null;
    const reset = () => { ridge = new Array(Math.max(2, Math.ceil(W / 6) + 2)).fill(0.15); flash = 0; bolt = null; };
    reset();
    return {
      resize: reset,
      draw(c, w, h, s, dt) {
        // Right edge pushes the newest spectrum fold; the world scrolls left.
        ridge.push(s.bands.reduce((a, b, i) => a + b * (1 + i / BANDS), 0) / BANDS * 2.2 + s.level * 0.4);
        ridge.shift();
        c.clearRect(0, 0, w, h);
        const base = h * 0.9, span = w / (ridge.length - 1);
        const horizon = h * 0.28;
        // Back layer — slow, dim echo shifted up.
        c.globalCompositeOperation = 'lighter';
        for (const [sc, al, hoff] of [[1.35, 0.20, 95], [1.0, 0.5, 10]]) {
          c.beginPath();
          c.moveTo(-4, base + 4);
          for (let i = 0; i < ridge.length; i++) {
            const y = base - ridge[i] * h * 0.55 * sc - (sc - 1) * h * 0.08;
            c.lineTo(i * span, Math.max(horizon * (sc - 1 > 0 ? 1.35 : 0), y));
          }
          c.lineTo(w + 4, base + 4);
          c.closePath();
          const g = c.createLinearGradient(0, horizon, 0, base);
          g.addColorStop(0, col(hoff, 95, 60, al * 0.5));
          g.addColorStop(1, col(hoff + 30, 90, 40, al * 0.25));
          c.fillStyle = g;
          c.fill();
          // Neon ridge stroke.
          c.beginPath();
          for (let i = 0; i < ridge.length; i++) {
            const y = base - ridge[i] * h * 0.55 * sc - (sc - 1) * h * 0.08;
            i ? c.lineTo(i * span, y) : c.moveTo(i * span, y);
          }
          c.strokeStyle = col(hoff, 100, 70, 0.35 + al * 0.6);
          c.lineWidth = sc > 1 ? 1 : 1.8;
          c.shadowColor = col(hoff, 100, 60, 0.9);
          c.shadowBlur = 10;
          c.stroke();
          c.shadowBlur = 0;
        }
        // Horizon glow band.
        const hg = c.createLinearGradient(0, horizon - 30, 0, horizon + 30);
        hg.addColorStop(0, col(75, 100, 64, 0));
        hg.addColorStop(0.5, col(75, 100, 70, 0.10 + s.level * 0.22));
        hg.addColorStop(1, col(75, 100, 64, 0));
        c.fillStyle = hg;
        c.fillRect(0, horizon - 30, w, 60);
        // Lightning on hard transients.
        if (s.peak > 0.86 && flash <= 0) { flash = 1; bolt = { x: Math.random() * w, y: horizon }; }
        if (flash > 0) {
          flash = Math.max(0, flash - dt * 3.2);
          if (bolt) {
            c.strokeStyle = `rgba(240,250,255,${flash * 0.9})`;
            c.lineWidth = 1.5;
            c.shadowColor = col(15, 100, 75, 1);
            c.shadowBlur = 14;
            c.beginPath();
            let bx = bolt.x, by = bolt.y;
            c.moveTo(bx, by);
            for (let i = 0; i < 6; i++) { bx += (Math.random() - 0.5) * 46; by += (base - bolt.y) / 6; c.lineTo(bx, by); }
            c.stroke();
            c.shadowBlur = 0;
          }
          c.fillStyle = `rgba(200,235,255,${flash * 0.06})`;
          c.fillRect(0, 0, w, h);
        }
        c.globalCompositeOperation = 'source-over';
      },
      reset,
    };
  },

  /* v5 — Resonance Orbs: five glass orbs orbiting a centroid, band-group driven. */
  v5() {
    const groups = [[0, 4], [5, 9], [10, 14], [15, 19], [20, 23]];
    const hoffs = [22, -2, -40, -158, 115];
    const orbs = groups.map((_, i) => ({ a: (i / 5) * TAU, r: 0, e: 0 }));
    let cx = 0, cy = 0, drift = 0;
    return {
      draw(c, w, h, s, dt) {
        drift += dt * (0.15 + s.level * 0.55);
        cx = w / 2 + Math.sin(drift * 0.7) * w * 0.05;
        cy = h / 2 + Math.cos(drift * 0.9) * h * 0.06;
        c.clearRect(0, 0, w, h);
        c.globalCompositeOperation = 'lighter';
        // Faint connective web.
        c.strokeStyle = col(8, 100, 73, 0.05 + s.level * 0.12);
        c.lineWidth = 1;
        const pts = [];
        for (let i = 0; i < 5; i++) {
          const o = orbs[i];
          o.e += (avg(s.bands, groups[i][0], groups[i][1]) - o.e) * (o.e < avg(s.bands, groups[i][0], groups[i][1]) ? 0.4 : 0.15);
          o.a += dt * (0.4 + s.level * 1.6) * (i % 2 ? 1 : -1) * (0.6 + o.e);
          const orbit = Math.min(w, h) * (0.10 + i * 0.045 + o.e * 0.14);
          const x = cx + Math.cos(o.a) * orbit * (1 + s.level * 0.25);
          const y = cy + Math.sin(o.a * (i % 2 ? 1 : 0.85)) * orbit;
          o.x = x; o.y = y;
          pts.push([x, y]);
        }
        c.beginPath();
        for (const [x, y] of pts) { c.moveTo(cx, cy); c.lineTo(x, y); }
        c.stroke();
        // Orbs — glass sphere look: hot rim, inner body, specular dot.
        for (let i = 0; i < 5; i++) {
          const o = orbs[i], hoff = hoffs[i];
          const r = Math.min(w, h) * (0.045 + o.e * 0.075 + s.peak * 0.012);
          const g = c.createRadialGradient(o.x - r * 0.35, o.y - r * 0.4, r * 0.1, o.x, o.y, r);
          g.addColorStop(0, col(hoff, 60, 88, 0.5 + o.e * 0.45));
          g.addColorStop(0.55, col(hoff, 85, 58, 0.28 + o.e * 0.5));
          g.addColorStop(1, col(hoff, 90, 45, 0.06));
          c.fillStyle = g;
          c.beginPath(); c.arc(o.x, o.y, r, 0, TAU); c.fill();
          c.strokeStyle = col(hoff, 95, 75, 0.25 + o.e * 0.65);
          c.lineWidth = 1.2;
          c.stroke();
          // Outer halo.
          const hg = c.createRadialGradient(o.x, o.y, r, o.x, o.y, r * 2.6);
          hg.addColorStop(0, col(hoff, 95, 62, 0.10 + o.e * 0.3));
          hg.addColorStop(1, col(30, 90, 50, 0));
          c.fillStyle = hg;
          c.beginPath(); c.arc(o.x, o.y, r * 2.6, 0, TAU); c.fill();
        }
        // Centroid core.
        const cr = Math.min(w, h) * (0.02 + s.level * 0.03);
        const cg = c.createRadialGradient(cx, cy, 0, cx, cy, cr * 2.4);
        cg.addColorStop(0, `rgba(240,250,255,${0.5 + s.level * 0.5})`);
        cg.addColorStop(1, col(12, 100, 75, 0));
        c.fillStyle = cg;
        c.beginPath(); c.arc(cx, cy, cr * 2.4, 0, TAU); c.fill();
        c.globalCompositeOperation = 'source-over';
      },
      reset() { for (const o of orbs) o.e = 0; drift = 0; },
    };
  },

  /* v6 — Bass Bloom: organic radial flower; bass unfurls the petals, mids
     widen them, peaks fire a pollen burst. */
  v6() {
    const PETALS = 12;
    const dust = [];
    return {
      draw(c, w, h, s, dt) {
        const bass = avg(s.bands, 0, 5), mid = avg(s.bands, 6, 14);
        const cx = w / 2, cy = h * 0.52;
        c.clearRect(0, 0, w, h);
        c.globalCompositeOperation = 'lighter';
        const now = performance.now();
        const rot = now * 0.00018;
        for (let i = 0; i < PETALS; i++) {
          const a = rot + (i / PETALS) * TAU;
          const e = bass * (0.7 + 0.3 * Math.sin(now * 0.0011 + i * 1.3));
          const len = Math.min(w, h) * (0.15 + e * 0.30 + mid * 0.07);
          const wid = len * (0.36 + mid * 0.28);
          const px = cx + Math.cos(a) * len * 0.5, py = cy + Math.sin(a) * len * 0.5;
          const g = c.createRadialGradient(px, py, 0, px, py, len * 0.6);
          g.addColorStop(0, col(25 + i * 5, 95, 66, 0.10 + e * 0.38));
          g.addColorStop(1, col(38 + i * 5, 90, 50, 0));
          c.fillStyle = g;
          c.beginPath(); c.ellipse(px, py, len * 0.55, wid * 0.5, a, 0, TAU); c.fill();
        }
        // Pollen burst on transients.
        if (s.peak > 0.68 && Math.random() < 0.55) {
          for (let i = 0; i < 4; i++)
            dust.push({ x: cx, y: cy, vx: (Math.random() - 0.5) * 280,
                        vy: (Math.random() - 0.5) * 280 - 60, life: 1, r: 1 + Math.random() * 2.4 });
        }
        for (let i = dust.length - 1; i >= 0; i--) {
          const d = dust[i];
          d.life -= dt * 1.5; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 130 * dt;
          if (d.life <= 0) { dust.splice(i, 1); continue; }
          c.fillStyle = col(45, 100, 74, 0.55 * d.life);
          c.beginPath(); c.arc(d.x, d.y, d.r, 0, TAU); c.fill();
        }
        // Stamen core.
        const cr = Math.min(w, h) * (0.05 + bass * 0.06 + s.peak * 0.03);
        const cg = c.createRadialGradient(cx, cy, 0, cx, cy, cr * 2.2);
        cg.addColorStop(0, `rgba(250,252,255,${0.55 + bass * 0.4})`);
        cg.addColorStop(0.5, col(20, 95, 65, 0.3 + bass * 0.4));
        cg.addColorStop(1, col(30, 90, 50, 0));
        c.fillStyle = cg; c.beginPath(); c.arc(cx, cy, cr * 2.2, 0, TAU); c.fill();
        c.globalCompositeOperation = 'source-over';
      },
      reset() { dust.length = 0; },
    };
  },

  /* v7 — Equalizer Skyline: 24 towers = 24 bands; rooflines glow, windows
     flicker on transients; `level` lifts the sky haze. */
  v7() {
    const hist = new Array(BANDS).fill(0);
    const win = [];
    const seedWin = () => { win.length = 0; for (let i = 0; i < BANDS * 9; i++) win.push(Math.random()); };
    seedWin();
    return {
      resize: seedWin,
      draw(c, w, h, s, dt) {
        c.clearRect(0, 0, w, h);
        const n = BANDS, bw = w / n, floor = h * 0.96;
        // Sky haze.
        const sky = c.createLinearGradient(0, 0, 0, floor);
        sky.addColorStop(0, col(40, 90, 30, 0.10 + s.level * 0.22));
        sky.addColorStop(0.6, col(20, 80, 20, 0.04 + s.level * 0.08));
        sky.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = sky; c.fillRect(0, 0, w, floor);
        // Moon.
        const mg = c.createRadialGradient(w * 0.82, h * 0.16, 0, w * 0.82, h * 0.16, h * 0.12);
        mg.addColorStop(0, col(50, 30, 90, 0.5 + s.level * 0.3));
        mg.addColorStop(1, col(50, 40, 80, 0));
        c.fillStyle = mg; c.beginPath(); c.arc(w * 0.82, h * 0.16, h * 0.12, 0, TAU); c.fill();
        for (let i = 0; i < n; i++) {
          hist[i] += (s.bands[i] - hist[i]) * (s.bands[i] > hist[i] ? 0.5 : 0.12);
          const e = hist[i], bh = Math.max(4, e * h * 0.72), x = i * bw + bw * 0.08, bw2 = bw * 0.84;
          const hoff = (i / n) * 130;
          c.fillStyle = col(10 + (i / n) * 30, 70, TH.light ? 18 : 10, 0.85);
          c.fillRect(x, floor - bh, bw2, bh);
          c.fillStyle = col(hoff, 100, 65, 0.5 + e * 0.5);
          c.fillRect(x, floor - bh, bw2, Math.max(1.5, e * 3));
          const rows = Math.max(2, Math.floor(bh / 13)), cols = Math.max(2, Math.floor(bw2 / 9));
          for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
            const idx = (i * 97 + r * 31 + q * 7) % win.length;
            if (Math.random() < s.peak * 0.012) win[idx] = Math.random();
            if (win[idx] >= 0.25 + e * 0.55) continue;
            const flick = win[(idx + 1) % win.length] < 0.03 + s.peak * 0.05 ? 0.35 : 1;
            c.fillStyle = col(48, 95, 72, (0.25 + e * 0.6) * flick);
            c.fillRect(x + 2 + q * (bw2 - 4) / cols, floor - bh + 4 + r * (bh - 6) / rows,
                       (bw2 - 4) / cols * 0.55, (bh - 6) / rows * 0.5);
          }
        }
      },
      reset() { hist.fill(0); seedWin(); },
    };
  },

  /* v8 — Spiral Sequencer: 24 dots ride an Archimedean spiral; each band
     swells its dot, `level` spins the whole constellation. */
  v8() {
    let rot = 0;
    return {
      draw(c, w, h, s, dt) {
        rot += dt * (0.15 + s.level * 0.9);
        const cx = w / 2, cy = h / 2, Rm = Math.min(w, h) * 0.42, LOOPS = TAU * 3.2;
        c.clearRect(0, 0, w, h);
        c.globalCompositeOperation = 'lighter';
        c.strokeStyle = col(20, 80, 60, 0.10);
        c.beginPath();
        for (let i = 0; i < 120; i++) {
          const t = (i / 120) * LOOPS, r = Rm * (t / LOOPS);
          const x = cx + Math.cos(t + rot) * r, y = cy + Math.sin(t + rot) * r;
          i ? c.lineTo(x, y) : c.moveTo(x, y);
        }
        c.stroke();
        for (let i = 0; i < BANDS; i++) {
          const t = (i / BANDS) * LOOPS, r = Rm * (0.15 + (t / LOOPS) * 0.85);
          const e = s.bands[i];
          const x = cx + Math.cos(t + rot) * r, y = cy + Math.sin(t + rot) * r;
          const rad = 1.5 + e * 7 + s.peak * 1.5, hoff = (i / BANDS) * 130;
          const g = c.createRadialGradient(x, y, 0, x, y, rad * 3);
          g.addColorStop(0, col(hoff, 95, 70, 0.25 + e * 0.7));
          g.addColorStop(1, col(hoff, 90, 50, 0));
          c.fillStyle = g; c.beginPath(); c.arc(x, y, rad * 3, 0, TAU); c.fill();
          c.fillStyle = col(hoff, 100, 82, 0.5 + e * 0.5);
          c.beginPath(); c.arc(x, y, rad, 0, TAU); c.fill();
        }
        c.globalCompositeOperation = 'source-over';
      },
      reset() { rot = 0; },
    };
  },

  /* v9 — Comet Trails: 24 lanes of comet streaks; energy drives speed,
     length and girth; peaks scatter a meteor shower. */
  v9() {
    const comets = new Array(BANDS).fill(0).map((_, i) => ({ x: Math.random(), y: (i + 0.5) / BANDS, sp: 0.3 + i * 0.02 }));
    const meteors = [];
    return {
      draw(c, w, h, s, dt) {
        c.clearRect(0, 0, w, h);
        c.globalCompositeOperation = 'lighter';
        for (let i = 0; i < BANDS; i++) {
          const cm = comets[i], e = s.bands[i], hoff = (i / BANDS) * 120;
          cm.x += dt * (0.06 + e * 0.55 + cm.sp * 0.1);
          if (cm.x > 1.15) { cm.x = -0.15; cm.y = (i + 0.3 + Math.random() * 0.4) / BANDS; }
          const x = cm.x * w, y = cm.y * h, len = w * (0.05 + e * 0.22);
          const g = c.createLinearGradient(x, y, x - len, y);
          g.addColorStop(0, col(hoff, 95, 70, 0.5 + e * 0.5));
          g.addColorStop(1, col(hoff, 90, 50, 0));
          c.strokeStyle = g; c.lineWidth = 1 + e * 4 + s.peak * 1.5;
          c.beginPath(); c.moveTo(x, y); c.lineTo(x - len, y); c.stroke();
          const hg = c.createRadialGradient(x, y, 0, x, y, 4 + e * 8);
          hg.addColorStop(0, col(hoff, 100, 80, 0.6 + e * 0.4));
          hg.addColorStop(1, col(hoff, 95, 55, 0));
          c.fillStyle = hg; c.beginPath(); c.arc(x, y, 4 + e * 8, 0, TAU); c.fill();
        }
        if (s.peak > 0.8)
          for (let i = 0; i < 2; i++)
            meteors.push({ x: Math.random() * w * 0.9, y: -10,
                           vx: 180 + Math.random() * 160, vy: 320 + Math.random() * 240, life: 1 });
        for (let i = meteors.length - 1; i >= 0; i--) {
          const m = meteors[i];
          m.life -= dt * 1.1; m.x += m.vx * dt; m.y += m.vy * dt;
          if (m.life <= 0 || m.y > h + 20) { meteors.splice(i, 1); continue; }
          const g = c.createLinearGradient(m.x, m.y, m.x - m.vx * 0.12, m.y - m.vy * 0.12);
          g.addColorStop(0, col(40, 100, 80, 0.7 * m.life));
          g.addColorStop(1, col(40, 95, 55, 0));
          c.strokeStyle = g; c.lineWidth = 1.6;
          c.beginPath(); c.moveTo(m.x, m.y); c.lineTo(m.x - m.vx * 0.12, m.y - m.vy * 0.12); c.stroke();
        }
        c.globalCompositeOperation = 'source-over';
      },
      reset() { meteors.length = 0; for (const cm of comets) cm.x = Math.random(); },
    };
  },

  /* v10 — Pulse Lattice: hex grid; each cell owns a band, beat waves race
     outward from the centroid and ignite cells as they pass. */
  v10() {
    let cells = [], wave = -1, cellR = 10;
    const seed = () => {
      cells = [];
      cellR = Math.max(9, Math.min(W, H) / 22);
      for (let y = -1; y * cellR * 1.5 < H + cellR; y++)
        for (let x = -1; x * cellR * 1.73 < W + cellR; x++) {
          const px = x * cellR * 1.73 + (Math.abs(y) % 2 ? cellR * 0.87 : 0);
          const b = (((x * 7 + y * 13) % BANDS) + BANDS) % BANDS;
          cells.push({ x: px, y: y * cellR * 1.5, b });
        }
    };
    seed();
    return {
      resize: seed,
      draw(c, w, h, s, dt) {
        c.clearRect(0, 0, w, h);
        c.globalCompositeOperation = 'lighter';
        if (s.peak > 0.55 && wave < 0) wave = 0;
        if (wave >= 0) { wave += dt * Math.min(w, h) * 2.4; if (wave > Math.min(w, h) * 0.95) wave = -1; }
        const cx = w / 2, cy = h / 2, r = cellR * 0.82;
        for (const cell of cells) {
          const e = s.bands[cell.b];
          const d = Math.hypot(cell.x - cx, cell.y - cy);
          const ring = wave >= 0 ? Math.max(0, 1 - Math.abs(d - wave) / (cellR * 2.5)) : 0;
          const glow = e * 0.55 + ring * 0.7 + s.level * 0.05;
          if (glow < 0.035) continue;
          c.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = (k / 6) * TAU + Math.PI / 6;
            k ? c.lineTo(cell.x + Math.cos(a) * r, cell.y + Math.sin(a) * r)
              : c.moveTo(cell.x + Math.cos(a) * r, cell.y + Math.sin(a) * r);
          }
          c.closePath();
          const hoff = (cell.b / BANDS) * 130;
          c.fillStyle = col(hoff, 95, 60, glow * 0.5); c.fill();
          c.strokeStyle = col(hoff, 95, 72, glow * 0.5); c.lineWidth = 1; c.stroke();
        }
        c.globalCompositeOperation = 'source-over';
      },
      reset() { wave = -1; },
    };
  },
};

function avg(b, a, z) { let s = 0; for (let i = a; i <= z; i++) s += b[i]; return s / (z - a + 1); }
function roundTop(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  c.beginPath();
  c.moveTo(x, y + h);
  c.lineTo(x, y + r);
  c.arcTo(x, y, x + w / 2, y - r * 0.15, r);
  c.arcTo(x + w / 2, y - r * 0.15, x + w, y + r, r);
  c.lineTo(x + w, y + h);
  c.closePath();
}

R = BUILDS[style]();

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (snap.paused) {
    // Freeze + dim once, then stop the loop entirely — the engine's stream is
    // stopped so nothing will change until the next unpause message anyway.
    if (!frozen) { document.body.classList.add('paused'); frozen = true; }
    raf = 0;
    return;
  }
  if (frozen) { document.body.classList.remove('paused'); frozen = false; }
  R.draw(ctx, W, H, snap, dt);
}

if (wv) {
  wv.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.t === 'vizSpectrum') {
      if (Array.isArray(m.bands) && m.bands.length === BANDS) {
        for (let i = 0; i < BANDS; i++) snap.bands[i] = m.bands[i] || 0;
      }
      snap.level = m.level || 0; snap.peak = m.peak || 0;
      const was = snap.paused;
      snap.paused = !!m.paused;
      // Wake the halted loop when the stream resumes.
      if (!snap.paused && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
      else if (!was && snap.paused) { /* let the running frame draw the freeze */ }
    }
    else if (m.t === 'vizStyle' && BUILDS[m.style]) {
      style = m.style;
      R = BUILDS[style]();
      document.body.classList.remove('paused');
      frozen = false;
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
    }
    else if (m.t === 'vizTheme') {
      TH.adaptive = m.adaptive !== false;
      if (!TH.adaptive) { TH.hue = DEF_HUE; TH.light = false; }
      else {
        const h = hexHue(m.accent);
        if (h !== null) TH.hue = h;
        TH.light = m.isLightBackdrop === true;
      }
    }
  });
  wv.postMessage({ type: 'vizReady' });
}

raf = requestAnimationFrame(frame);
</script>
