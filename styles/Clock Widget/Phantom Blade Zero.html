<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- cde-meta {"id": "Phantom Blade Zero", "label": "Phantom Blade Zero", "author": "CoreDesk Engine", "version": 1} -->
<!-- COREDESK_LOCALE -->
<title data-i18n="Phantom Blade Zero Clock">Phantom Blade Zero Clock</title>
<script src="i18n.js"></script>
<style>
  :root {
    --accent: #c1272d;
    --accent-glow: rgba(193, 39, 45, 0.5);
    --bone: #e8e4da;
    --ink: rgba(8, 10, 14, 0.62);
    --ink-edge: rgba(193, 39, 45, 0.4);
    --muted: rgba(232, 228, 218, 0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: transparent !important;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--bone);
    display: flex; align-items: center; justify-content: center;
  }
  #widget-root {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center; position: relative;
    transform-origin: center;
  }

  .pbz-face {
    display: flex; align-items: stretch; gap: 4vmin;
    padding: 5vmin 6.5vmin;
    background: var(--ink);
    border: 1px solid var(--ink-edge);
    border-radius: 2.2vmin;
    box-shadow: 0 2vmin 6vmin rgba(0,0,0,0.55), inset 0 0 4vmin rgba(0,0,0,0.4);
    backdrop-filter: blur(1.2vmin);
    position: relative;
  }
  /* vertical crimson brush stroke */
  .pbz-face::before {
    content: ""; position: absolute; left: 3.2vmin; top: 8%; bottom: 8%;
    width: 0.9vmin; border-radius: 1vmin;
    background: linear-gradient(180deg, transparent, var(--accent) 18%, var(--accent) 82%, transparent);
    box-shadow: 0 0 2.2vmin var(--accent-glow);
  }
  .pbz-time {
    font-size: 24vmin; font-weight: 400; letter-spacing: 0.01em;
    line-height: 1; padding-left: 2vmin;
    text-shadow: 0 0.6vmin 2.4vmin rgba(0,0,0,0.7);
    font-variant-numeric: tabular-nums;
  }
  .pbz-time b { font-weight: 400; color: var(--accent); }
  .pbz-side {
    display: flex; flex-direction: column; justify-content: center; gap: 2.2vmin;
    min-width: 20vmin;
  }
  .pbz-day  { font-size: 7vmin; letter-spacing: 0.14em; color: var(--bone); }
  .pbz-date { font-size: 5.5vmin; letter-spacing: 0.1em; color: var(--muted); }
  .pbz-ampm { font-size: 4.5vmin; letter-spacing: 0.3em; color: var(--accent); }
  /* seal-stamp ornament */
  .pbz-seal {
    align-self: flex-start;
    font-family: 'Microsoft JhengHei', 'MingLiU', serif;
    font-size: 6vmin; line-height: 1.15;
    color: var(--bone);
    background: var(--accent);
    border-radius: 0.8vmin;
    padding: 0.7vmin 1vmin;
    box-shadow: 0 0 2vmin var(--accent-glow);
    writing-mode: vertical-rl;
  }
  body.light-backdrop .pbz-face {
    background: rgba(240, 236, 226, 0.6);
    color: #14161a;
  }
  body.light-backdrop .pbz-day { color: #14161a; }
  body.light-backdrop .pbz-date { color: rgba(20,22,26,0.6); }
</style>
</head>
<body>
<div id="widget-root">
  <div class="pbz-face">
    <div class="pbz-time"><span class="js-hh"></span><b>:</b><span class="js-mm"></span></div>
    <div class="pbz-side">
      <div class="pbz-seal">影刃</div>
      <div>
        <div class="pbz-day js-day"></div>
        <div class="pbz-date js-date"></div>
        <div class="pbz-ampm js-ap"></div>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('widget-root');
  const wv = window.chrome && window.chrome.webview;
  let locale = (window.COREDESK_LOCALE && COREDESK_LOCALE.locale) || 'en';
  let dayFmt, dateFmt, ampmFmt;
  function applyLocale(tag) {
    locale = tag || 'en';
    dayFmt  = new Intl.DateTimeFormat(locale, { weekday: 'long' });
    dateFmt = new Intl.DateTimeFormat(locale, { month: 'long', day: 'numeric' });
    ampmFmt = new Intl.DateTimeFormat(locale, { hour: 'numeric', hour12: true });
  }
  applyLocale(locale);
  const pad = (n) => String(n).padStart(2, '0');
  const ampm = (d) => {
    const p = ampmFmt.formatToParts(d).find((x) => x.type === 'dayPeriod');
    return p ? p.value : '';
  };

  let elsCfg = {}, adaptiveOn = false, fmt24 = true;
  const EL_SELS = {
    time: '.js-hh,.js-mm,.js-ap',
    day: '.js-day',
    date: '.js-date',
  };
  const $ = (sel) => root.querySelector(sel);
  const $$ = (sel) => root.querySelectorAll(sel);

  function applyEls() {
    for (const name in EL_SELS) {
      const p = elsCfg[name] || {};
      const sc = (typeof p.scale === 'number' && isFinite(p.scale) && p.scale > 0) ? p.scale : 1;
      const dx = (typeof p.offsetX === 'number' && isFinite(p.offsetX)) ? p.offsetX : 0;
      const dy = (typeof p.offsetY === 'number' && isFinite(p.offsetY)) ? p.offsetY : 0;
      $$(EL_SELS[name]).forEach((el) => {
        el.style.fontSize = '';
        const base = parseFloat(getComputedStyle(el).fontSize) || 0;
        el.style.fontSize = sc !== 1 ? base * sc + 'px' : '';
        el.style.color = adaptiveOn ? '' : (typeof p.color === 'string' ? p.color : '');
        el.style.transform = (dx || dy) ? `translate(${dx}px, ${dy}px)` : '';
        el.style.display = (dx || dy) ? 'inline-block' : '';
      });
    }
  }

  function refit() {
    const face = root.firstElementChild;
    if (!face) return;
    face.style.transform = '';
    const r = face.getBoundingClientRect();
    const s = Math.min(innerWidth / (r.width || 1), innerHeight / (r.height || 1), 1) * 0.98;
    face.style.transform = `scale(${s})`;
  }

  function tick() {
    const d = new Date();
    let h = d.getHours();
    const apEl = $('.js-ap');
    if (!fmt24) {
      apEl.textContent = ampm(d);
      h = h % 12 || 12;
      $('.js-hh').textContent = String(h);
    } else {
      apEl.textContent = '';
      $('.js-hh').textContent = pad(h);
    }
    $('.js-mm').textContent = pad(d.getMinutes());
    $('.js-day').textContent = dayFmt.format(d);
    $('.js-date').textContent = dateFmt.format(d);
  }

  if (wv) {
    wv.addEventListener('message', (e) => {
      const m = e.data || {};
      if (m.t === 'clockStyle') {
        if (m.els) elsCfg = m.els;
        if (m.adaptive !== undefined) adaptiveOn = m.adaptive !== false;
        if (m.use24Hour !== undefined) fmt24 = m.use24Hour !== false;
        applyEls(); tick();
      }
      else if (m.t === 'clockTheme') {
        const on = m.adaptive !== false;
        adaptiveOn = on;
        if (m.els) elsCfg = m.els;
        if (m.use24Hour !== undefined && fmt24 !== (m.use24Hour !== false)) {
          fmt24 = m.use24Hour !== false; tick();
        }
        if (m.isLightBackdrop !== undefined)
          document.body.classList.toggle('light-backdrop', on && !!m.isLightBackdrop);
        else if (!on)
          document.body.classList.remove('light-backdrop');
        if (!on || m.accent !== undefined) {
          const accent = on && /^#[0-9a-fA-F]{6}$/.test(m.accent || '') ? m.accent : '#c1272d';
          const rs = document.documentElement.style;
          rs.setProperty('--accent', accent);
          const r = parseInt(accent.slice(1,3),16), g = parseInt(accent.slice(3,5),16), b = parseInt(accent.slice(5,7),16);
          rs.setProperty('--accent-glow', `rgba(${r},${g},${b},0.5)`);
        }
        applyEls();
      }
      else if (m.t === 'clockLocale') {
        window.COREDESK_LOCALE = { locale: m.locale, translations: m.translations };
        if (window.CoreDeskI18n) CoreDeskI18n.set(m.locale, m.translations);
        applyLocale(m.locale); tick();
      }
    });
    wv.postMessage({ type: 'clockReady' });
  }

  window.addEventListener('resize', () => { applyEls(); refit(); });
  tick(); refit();
  setInterval(tick, 500);
})();
</script>
</body>
</html>
