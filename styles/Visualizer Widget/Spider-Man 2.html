<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- cde-meta {"id": "Spider-Man 2", "label": "Spider-Man 2", "author": "CoreDesk Engine", "version": 1} -->
<!-- COREDESK_LOCALE -->
<title data-i18n="Spider-Man 2 Visualizer">Spider-Man 2 Visualizer</title>
<script src="i18n.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: transparent !important;
  }
  #stage { display: block; width: 100vw; height: 100vh; background: transparent !important; }
  body.paused #stage { opacity: 0.55; transition: opacity 0.3s; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  const wv = window.chrome && window.chrome.webview;
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const BANDS = 24;
  const SPOKES = 16;
  const RINGS = 6;
  const DEF_HUE = 357; // Spider-Man crimson (#e62429)
  const TH = { adaptive: false, hue: DEF_HUE, light: false };
  const snap = { bands: new Float32Array(BANDS), smooth: new Float32Array(BANDS), level: 0, peak: 0, paused: false };
  let sparks = [];
  let W = 0, H = 0, raf = 0, frozen = false, last = performance.now(), phase = 0;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  function hexHue(hex) {
    if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) return null;
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
    if (d < 0.05) return null;
    let h;
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    return ((h * 60) + 360) % 360;
  }

  function bandAtSpoke(s) {
    // Symmetrical mapping around the vertical axis so the web pulses balanced left/right
    const norm = Math.abs((s / SPOKES) * 2 - 1);
    const idx = Math.min(BANDS - 1, Math.floor(norm * (BANDS - 1)));
    return snap.smooth[idx];
  }

  function drawSpiderEmblem(cx, cy, baseR, energy, hue) {
    ctx.save();
    const scale = (baseR / 28) * (1 + energy * 0.28);
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    ctx.shadowColor = `hsla(${hue}, 95%, 55%, ${0.65 + energy * 0.35})`;
    ctx.shadowBlur = 12 + energy * 18;
    ctx.fillStyle = `hsla(${hue}, 92%, ${52 + energy * 14}%, 0.96)`;
    ctx.strokeStyle = `hsla(${hue}, 95%, ${58 + energy * 18}%, 0.98)`;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Spider cephalothorax + sharp elongated Spider-Man 2 abdomen
    ctx.beginPath();
    ctx.moveTo(0, -13);
    ctx.lineTo(5.2, -3);
    ctx.lineTo(0, 17);
    ctx.lineTo(-5.2, -3);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, -16, 3.6, 0, Math.PI * 2);
    ctx.fill();

    // 4 pairs of angular Insomniac-style spider legs flexing with bass energy
    const flex = energy * 3.5;
    const legs = [
      [[-3.5, -9], [-13, -19 - flex], [-18, -30 - flex]],
      [[-4.5, -5], [-18, -9], [-24, -15 - flex * 0.5]],
      [[-4.5, -1], [-17, 6], [-23, 16 + flex * 0.5]],
      [[-3.5, 4],  [-11, 16 + flex], [-15, 29 + flex]],
    ];
    for (const side of [-1, 1]) {
      for (const [[x0, y0], [x1, y1], [x2, y2]] of legs) {
        ctx.beginPath();
        ctx.moveTo(x0 * side, y0);
        ctx.lineTo(x1 * side, y1);
        ctx.lineTo(x2 * side, y2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function draw(dt) {
    phase += dt * (1.2 + snap.level * 3.2);
    for (let i = 0; i < BANDS; i++) {
      const target = Math.min(1, snap.bands[i] || 0);
      const rate = target > snap.smooth[i] ? 18 : 7.5;
      snap.smooth[i] += (target - snap.smooth[i]) * Math.min(1, dt * rate);
    }

    const hue = TH.adaptive ? TH.hue : DEF_HUE;
    const blueHue = 212; // Miles / Peter electric web blue

    // Clear completely to preserve 100% transparent background
    ctx.clearRect(0, 0, W, H);

    const cx = W * 0.5;
    const cy = H * 0.5;
    const maxR = Math.min(W, H) * 0.45;
    if (maxR <= 4) return;

    const bass = (snap.smooth[0] + snap.smooth[1] + snap.smooth[2] + snap.smooth[3]) * 0.25;
    const mids = (snap.smooth[6] + snap.smooth[8] + snap.smooth[10] + snap.smooth[12]) * 0.25;
    const highs = (snap.smooth[16] + snap.smooth[19] + snap.smooth[21] + snap.smooth[23]) * 0.25;
    const overall = Math.max(snap.level, (bass * 0.5 + mids * 0.35 + highs * 0.15));

    // Precompute spoke tip angles and dynamic lengths
    const angles = [];
    const spokeEnergies = [];
    for (let s = 0; s < SPOKES; s++) {
      angles.push((s / SPOKES) * Math.PI * 2 - Math.PI * 0.5);
      spokeEnergies.push(bandAtSpoke(s));
    }

    // 1. Radial anchor spokes pulsing outward with each frequency band
    for (let s = 0; s < SPOKES; s++) {
      const a = angles[s];
      const v = spokeEnergies[s];
      const rOuter = maxR * (0.78 + v * 0.24 + Math.sin(phase + s) * 0.015);
      const x1 = cx + Math.cos(a) * (maxR * 0.12);
      const y1 = cy + Math.sin(a) * (maxR * 0.12);
      const x2 = cx + Math.cos(a) * rOuter;
      const y2 = cy + Math.sin(a) * rOuter;

      const grad = ctx.createLinearGradient(x1, y1, x2, y2);
      grad.addColorStop(0.0, `hsla(${hue}, 92%, 55%, ${0.45 + v * 0.45})`);
      grad.addColorStop(0.65, `hsla(${blueHue}, 90%, 68%, ${0.32 + v * 0.5})`);
      grad.addColorStop(1.0, `hsla(${hue}, 95%, 62%, ${0.7 + v * 0.3})`);

      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.2 + v * 2.2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // Glowing node at spoke tip
      ctx.fillStyle = `hsla(${hue}, 95%, ${60 + v * 25}%, ${0.55 + v * 0.45})`;
      ctx.beginPath();
      ctx.arc(x2, y2, 1.6 + v * 2.6, 0, Math.PI * 2);
      ctx.fill();

      if (v > 0.65 && Math.random() < v * 0.35) {
        sparks.push({
          x: x2,
          y: y2,
          vx: Math.cos(a) * (18 + v * 42) + (Math.random() - 0.5) * 14,
          vy: Math.sin(a) * (18 + v * 42) + (Math.random() - 0.5) * 14,
          life: 1,
          r: 1.1 + Math.random() * 1.8,
          hue: Math.random() < 0.65 ? hue : blueHue,
        });
      }
    }

    // 2. Scalloped concentric spider-web silk rings that ripple with audio bands
    for (let ring = 1; ring <= RINGS; ring++) {
      const t = ring / RINGS;
      const bandIdx = Math.min(BANDS - 1, Math.floor((1 - t) * (BANDS - 1)));
      const ringBand = snap.smooth[bandIdx];
      const baseRingR = maxR * (0.16 + t * 0.68) * (1 + bass * 0.10 + ringBand * 0.08);

      const isOuter = ring === RINGS;
      const ringHue = (ring % 2 === 0) ? blueHue : hue;
      const alpha = isOuter ? (0.65 + overall * 0.35) : (0.28 + ringBand * 0.55 + overall * 0.15);

      ctx.strokeStyle = `hsla(${ringHue}, 92%, ${56 + ringBand * 22}%, ${Math.min(1, alpha)})`;
      ctx.lineWidth = isOuter ? (1.8 + overall * 2.0) : (1.1 + ringBand * 1.8);

      ctx.beginPath();
      for (let s = 0; s < SPOKES; s++) {
        const nextS = (s + 1) % SPOKES;
        const a0 = angles[s];
        const a1 = angles[nextS];
        const v0 = spokeEnergies[s];
        const v1 = spokeEnergies[nextS];

        const r0 = baseRingR * (1 + v0 * 0.18);
        const r1 = baseRingR * (1 + v1 * 0.18);
        const p0x = cx + Math.cos(a0) * r0;
        const p0y = cy + Math.sin(a0) * r0;
        const p1x = cx + Math.cos(a1) * r1;
        const p1y = cy + Math.sin(a1) * r1;

        // Classic spider-web inward catenary sag between adjacent spokes
        let midA = (a0 + a1) * 0.5;
        if (nextS === 0) midA += Math.PI;
        const sag = 0.84 + ((v0 + v1) * 0.5) * 0.10;
        const rMid = ((r0 + r1) * 0.5) * sag;
        const cpx = cx + Math.cos(midA) * rMid;
        const cpy = cy + Math.sin(midA) * rMid;

        if (s === 0) ctx.moveTo(p0x, p0y);
        ctx.quadraticCurveTo(cpx, cpy, p1x, p1y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    // 3. Bio-electric / Venom-strike travelling shockwave ring on strong beats
    const waveR = maxR * (0.18 + ((phase * 0.45) % 0.78));
    if (overall > 0.08) {
      ctx.save();
      ctx.strokeStyle = `hsla(${hue}, 100%, 62%, ${(1 - (waveR / maxR)) * overall * 0.75})`;
      ctx.lineWidth = 1.5 + overall * 2.5;
      ctx.setLineDash([6, 8]);
      ctx.beginPath();
      ctx.arc(cx, cy, waveR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 4. Floating bio-electric sparks launched from vibrating web tips
    sparks = sparks.filter((p) => p.life > 0);
    for (const p of sparks) {
      p.life -= dt * 1.6;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      ctx.fillStyle = `hsla(${p.hue}, 96%, 66%, ${Math.max(0, p.life) * 0.9})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 5. Central Spider-Man emblem pulsing with bass energy
    drawSpiderEmblem(cx, cy, maxR * 0.16, bass * 0.8 + overall * 0.4, hue);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (snap.paused) {
      if (!frozen) { document.body.classList.add('paused'); frozen = true; }
      raf = 0;
      return;
    }
    if (frozen) { document.body.classList.remove('paused'); frozen = false; }
    raf = requestAnimationFrame(frame);
    draw(dt);
  }

  if (wv) {
    wv.addEventListener('message', (e) => {
      const m = e.data || {};
      if (m.t === 'vizSpectrum') {
        if (Array.isArray(m.bands) && m.bands.length === BANDS) {
          for (let i = 0; i < BANDS; i++) snap.bands[i] = m.bands[i] || 0;
        }
        snap.level = m.level || 0; snap.peak = m.peak || 0;
        snap.paused = !!m.paused;
        if (!snap.paused && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
      }
      else if (m.t === 'vizStyle') {
        document.body.classList.remove('paused');
        frozen = false;
        if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
      }
      else if (m.t === 'vizTheme') {
        TH.adaptive = m.adaptive === true;
        if (!TH.adaptive) { TH.hue = DEF_HUE; TH.light = false; }
        else {
          const h = hexHue(m.accent);
          if (h !== null) TH.hue = h;
          TH.light = m.isLightBackdrop === true;
        }
      }
    });
    wv.postMessage({ type: 'vizReady' });
  }

  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
