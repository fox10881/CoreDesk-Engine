<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- cde-meta {"id": "Phantom Blade Zero", "label": "Phantom Blade Zero", "author": "CoreDesk Engine", "version": 1} -->
<!-- COREDESK_LOCALE -->
<title data-i18n="Phantom Blade Zero Visualizer">Phantom Blade Zero Visualizer</title>
<script src="i18n.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: transparent !important;
  }
  #stage { display: block; width: 100vw; height: 100vh; }
  body.paused #stage { opacity: 0.55; transition: opacity 0.3s; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  const wv = window.chrome && window.chrome.webview;
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const BANDS = 24;
  const DEF_HUE = 355;           // crimson
  const TH = { adaptive: true, hue: DEF_HUE, light: false };
  const snap = { bands: new Float32Array(BANDS), level: 0, peak: 0, paused: false };
  let embers = [];
  let W = 0, H = 0, raf = 0, frozen = false, last = performance.now();

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  function hexHue(hex) {
    if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) return null;
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
    if (d < 0.05) return null;
    let h;
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    return ((h * 60) + 360) % 360;
  }

  function draw(dt) {
    const hue = TH.adaptive ? TH.hue : DEF_HUE;
    // fade trails — ink-black film
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(6, 7, 10, 0.28)';
    ctx.fillRect(0, 0, W, H);

    const n = BANDS;
    const bw = W / n;
    const bladeW = Math.max(2, bw * 0.42);
    const baseY = H;
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < n; i++) {
      const v = Math.min(1, snap.bands[i]);
      const x = i * bw + (bw - bladeW) / 2;
      const hMax = H * 0.82;
      const h = Math.max(2, v * hMax);
      const topY = baseY - h;
      // blade stroke: bright core -> ember edge -> transparent tip
      const g = ctx.createLinearGradient(0, baseY, 0, topY);
      g.addColorStop(0.0, `hsla(${hue}, 80%, 42%, 0.85)`);
      g.addColorStop(0.55, `hsla(${hue}, 85%, 55%, 0.75)`);
      g.addColorStop(0.9, `hsla(${hue + 12}, 95%, 68%, 0.9)`);
      g.addColorStop(1.0, `hsla(${hue + 20}, 100%, 80%, 0)`);
      ctx.fillStyle = g;
      // slight slant gives the column a katana edge
      const slant = bladeW * 0.35;
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(x + bladeW, baseY);
      ctx.lineTo(x + bladeW - slant, topY);
      ctx.lineTo(x + slant * 0.4, topY + bladeW * 0.3);
      ctx.closePath();
      ctx.fill();
      // hot tip
      ctx.fillStyle = `hsla(${hue + 15}, 100%, 72%, ${0.5 + v * 0.5})`;
      ctx.fillRect(x + slant * 0.4, topY, Math.max(1.5, bladeW * 0.5), 2);
      // embers spawn on peaks
      if (v > 0.62 && Math.random() < v * 0.5) {
        embers.push({
          x: x + bladeW * (0.2 + Math.random() * 0.6),
          y: topY + 4,
          vx: (Math.random() - 0.5) * 22,
          vy: -(14 + Math.random() * 30),
          life: 1,
          r: 0.8 + Math.random() * 1.7,
          hue: hue + Math.random() * 30,
        });
      }
    }

    // center reflection line — the blade's edge
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `hsla(${hue}, 70%, 60%, ${0.25 + snap.level * 0.3})`;
    ctx.fillRect(0, baseY - 1, W, 1);

    // embers
    ctx.globalCompositeOperation = 'lighter';
    embers = embers.filter((p) => p.life > 0);
    for (const p of embers) {
      p.life -= dt * 1.4;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy -= 8 * dt; // embers drift upward faster
      ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${Math.max(0, p.life) * 0.9})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (snap.paused) {
      if (!frozen) { document.body.classList.add('paused'); frozen = true; }
      raf = 0;
      return;
    }
    if (frozen) { document.body.classList.remove('paused'); frozen = false; }
    draw(dt);
  }

  if (wv) {
    wv.addEventListener('message', (e) => {
      const m = e.data || {};
      if (m.t === 'vizSpectrum') {
        if (Array.isArray(m.bands) && m.bands.length === BANDS) {
          for (let i = 0; i < BANDS; i++) snap.bands[i] = m.bands[i] || 0;
        }
        snap.level = m.level || 0; snap.peak = m.peak || 0;
        const was = snap.paused;
        snap.paused = !!m.paused;
        if (!snap.paused && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
      }
      else if (m.t === 'vizStyle') {
        document.body.classList.remove('paused');
        frozen = false;
        if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
      }
      else if (m.t === 'vizTheme') {
        TH.adaptive = m.adaptive !== false;
        if (!TH.adaptive) { TH.hue = DEF_HUE; TH.light = false; }
        else {
          const h = hexHue(m.accent);
          if (h !== null) TH.hue = h;
          TH.light = m.isLightBackdrop === true;
        }
      }
    });
    wv.postMessage({ type: 'vizReady' });
  }

  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
