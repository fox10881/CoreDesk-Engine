<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
  /* While the desktop is occluded the host stops pushing frames and the page
     freezes on the last draw — this class is only the edge-case fallback for a
     paused frame that did arrive (e.g. occlusion raced a live packet). */
  body.paused canvas { filter: saturate(0.4) brightness(0.55); }
</style>
<!-- cde-meta {"id": "v7", "label": "律动天际线", "author": "CoreDesk Engine", "version": 1} -->
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wv = window.chrome && chrome.webview;

const BANDS = 24;
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let R = null, style = 'v7', raf = 0, last = performance.now();
let frozen = false; // drew one dimmed paused frame and halted
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (R && R.resize) R.resize();
}
window.addEventListener('resize', resize);
resize();

// Latest pushed snapshot — the host's 33 ms feed.
const snap = { bands: new Array(BANDS).fill(0), level: 0, peak: 0, paused: false };

// Wallpaper-adaptive palette: `vizTheme` pushes the backdrop probe's accent
// hue + luminance; every renderer rebases its hues on `TH.hue` via `col()`.
// On bright backdrops strokes deepen (LL) and glow gains alpha (AL) so the
// neon stays readable; adaptive off restores the fixed cyber-cyan palette.
const DEF_HUE = 190;
const TH = { adaptive: true, hue: DEF_HUE, light: false };
const hue = off => (TH.adaptive ? TH.hue : DEF_HUE) + off;
const AL = a => Math.min(1, a * (TH.light ? 1.3 : 1));
const LL = l => Math.max(10, l - (TH.light ? 18 : 0));
const col = (off, s, l, a) => `hsla(${hue(off)}, ${s}%, ${LL(l)}%, ${AL(a)})`;
function hexHue(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return null;
  const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (d < 0.02) return DEF_HUE; // grey wallpaper → keep the cyber default
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}

// Per-design factory: { draw(ctx, w, h, s, dt), reset() }.
const BUILDS = {
    v7() {
    const hist = new Array(BANDS).fill(0);
    const win = [];
    const seedWin = () => { win.length = 0; for (let i = 0; i < BANDS * 9; i++) win.push(Math.random()); };
    seedWin();
    return {
      resize: seedWin,
      draw(c, w, h, s, dt) {
        c.clearRect(0, 0, w, h);
        const n = BANDS, bw = w / n, floor = h * 0.96;
        // Sky haze.
        const sky = c.createLinearGradient(0, 0, 0, floor);
        sky.addColorStop(0, col(40, 90, 30, 0.10 + s.level * 0.22));
        sky.addColorStop(0.6, col(20, 80, 20, 0.04 + s.level * 0.08));
        sky.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = sky; c.fillRect(0, 0, w, floor);
        // Moon.
        const mg = c.createRadialGradient(w * 0.82, h * 0.16, 0, w * 0.82, h * 0.16, h * 0.12);
        mg.addColorStop(0, col(50, 30, 90, 0.5 + s.level * 0.3));
        mg.addColorStop(1, col(50, 40, 80, 0));
        c.fillStyle = mg; c.beginPath(); c.arc(w * 0.82, h * 0.16, h * 0.12, 0, TAU); c.fill();
        for (let i = 0; i < n; i++) {
          hist[i] += (s.bands[i] - hist[i]) * (s.bands[i] > hist[i] ? 0.5 : 0.12);
          const e = hist[i], bh = Math.max(4, e * h * 0.72), x = i * bw + bw * 0.08, bw2 = bw * 0.84;
          const hoff = (i / n) * 130;
          c.fillStyle = col(10 + (i / n) * 30, 70, TH.light ? 18 : 10, 0.85);
          c.fillRect(x, floor - bh, bw2, bh);
          c.fillStyle = col(hoff, 100, 65, 0.5 + e * 0.5);
          c.fillRect(x, floor - bh, bw2, Math.max(1.5, e * 3));
          const rows = Math.max(2, Math.floor(bh / 13)), cols = Math.max(2, Math.floor(bw2 / 9));
          for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
            const idx = (i * 97 + r * 31 + q * 7) % win.length;
            if (Math.random() < s.peak * 0.012) win[idx] = Math.random();
            if (win[idx] >= 0.25 + e * 0.55) continue;
            const flick = win[(idx + 1) % win.length] < 0.03 + s.peak * 0.05 ? 0.35 : 1;
            c.fillStyle = col(48, 95, 72, (0.25 + e * 0.6) * flick);
            c.fillRect(x + 2 + q * (bw2 - 4) / cols, floor - bh + 4 + r * (bh - 6) / rows,
                       (bw2 - 4) / cols * 0.55, (bh - 6) / rows * 0.5);
          }
        }
      },
      reset() { hist.fill(0); seedWin(); },
    };
  },

  /* v8 — Spiral Sequencer: 24 dots ride an Archimedean spiral; each band
     swells its dot, `level` spins the whole constellation. */
};

function avg(b, a, z) { let s = 0; for (let i = a; i <= z; i++) s += b[i]; return s / (z - a + 1); }
function roundTop(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  c.beginPath();
  c.moveTo(x, y + h);
  c.lineTo(x, y + r);
  c.arcTo(x, y, x + w / 2, y - r * 0.15, r);
  c.arcTo(x + w / 2, y - r * 0.15, x + w, y + r, r);
  c.lineTo(x + w, y + h);
  c.closePath();
}

R = BUILDS[style]();

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (snap.paused) {
    // Freeze + dim once, then stop the loop entirely — the engine's stream is
    // stopped so nothing will change until the next unpause message anyway.
    if (!frozen) { document.body.classList.add('paused'); frozen = true; }
    raf = 0;
    return;
  }
  if (frozen) { document.body.classList.remove('paused'); frozen = false; }
  R.draw(ctx, W, H, snap, dt);
}

if (wv) {
  wv.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.t === 'vizSpectrum') {
      if (Array.isArray(m.bands) && m.bands.length === BANDS) {
        for (let i = 0; i < BANDS; i++) snap.bands[i] = m.bands[i] || 0;
      }
      snap.level = m.level || 0; snap.peak = m.peak || 0;
      const was = snap.paused;
      snap.paused = !!m.paused;
      // Wake the halted loop when the stream resumes.
      if (!snap.paused && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
      else if (!was && snap.paused) { /* let the running frame draw the freeze */ }
    }
    else if (m.t === 'vizStyle') {
      R = BUILDS[style]();
      document.body.classList.remove('paused');
      frozen = false;
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
    }
    else if (m.t === 'vizTheme') {
      TH.adaptive = m.adaptive !== false;
      if (!TH.adaptive) { TH.hue = DEF_HUE; TH.light = false; }
      else {
        const h = hexHue(m.accent);
        if (h !== null) TH.hue = h;
        TH.light = m.isLightBackdrop === true;
      }
    }
  });
  wv.postMessage({ type: 'vizReady' });
}

raf = requestAnimationFrame(frame);
</script>
</body>
</html>
